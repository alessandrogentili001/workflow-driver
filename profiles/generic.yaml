# Default Snakefile for this profile
snakefile: workflow/cavity_workflow.smk

# Executor settings
executor: cluster-generic
jobs: 1 # jobs to run in parallel
latency-wait: 60
shared-fs-usage: none

# --group flag is disabled since generic-cluster executor does not support rule grouping
# groups:
#   pre_processing: 1
#   core_analysis: 1
#   loop: 1 

# Default resources
default-resources:
  slurm_account: "phd_gentili_0"
  slurm_partition: "dcgp_usr_prod"
  runtime: 10
  ntasks_per_node: 8
  cpus_per_task: 4
  mem: "256G"

# We use local helper scripts to wrap SSH/SCP complexity.
# The Snakemake 8 plugin automatically appends arguments at the end, so no placeholders are needed!
cluster-generic-submit-cmd: "scripts/cluster_generic_submit.sh"
cluster-generic-status-cmd: "scripts/cluster_generic_status.sh"
cluster-generic-cancel-cmd: "scripts/cluster_generic_cancel.sh"

# how to reach the files in the rmeote cluster 
default-storage-provider: sftp
default-storage-prefix: "sftp://login.leonardo.cineca.it:22/leonardo_work/PHD_gentili/openfoam-cavity-workflow/"

# Provide your exact CINECA username profile details
storage-sftp-username: "agentil1"

config:
  remote_workdir: "/leonardo_work/PHD_gentili/openfoam-cavity-workflow"