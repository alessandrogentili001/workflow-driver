# Default Snakefile for this profile
snakefile: workflow/cavity_workflow.smk

# Executor settings
executor: cluster-generic
jobs: 1 # jobs to run in parallel
latency-wait: 60
shared-fs-usage: none

# Default resources
default-resources:
  slurm_account: "phd_gentili_0"
  slurm_partition: "dcgp_usr_prod"
  runtime: 1440
  ntasks_per_node: 8
  cpus_per_task: 1
  mem: "16G"

# We use local helper scripts to wrap SSH/SCP complexity.
# The Snakemake 8 plugin automatically appends arguments at the end, so no placeholders are needed!
cluster-generic-submit-cmd: "scripts/remote_submit.sh" # submit a job
cluster-generic-status-cmd: "scripts/remote_status.sh" # check a job status
cluster-generic-cancel-cmd: "scripts/remote_cancel.sh" # cancel a job

# how to reach the files in the remote cluster
default-storage-provider: sftp
default-storage-prefix: "sftp://login.leonardo.cineca.it:22/leonardo_work/PHD_gentili/workflow-driver/"

# Provide your exact HPC username profile details
storage-sftp-username: "agentil1"
